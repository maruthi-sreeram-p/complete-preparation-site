server {
  listen 80;
  root /usr/share/nginx/html;

  # the API: same origin as the page, so the cookie needs no CORS
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # hashed asset files never change, so browsers may keep them for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # every other path is a client-side route: serve the app and let React Router decide
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
