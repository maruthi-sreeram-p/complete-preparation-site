spring:
  application:
    name: notes-api
  datasource:
    # H2 in PostgreSQL mode keeps local runs to zero set-up; the "postgres" profile switches to the real thing
    url: jdbc:h2:file:./data/notes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that it matches the entities
  data:
    web:
      pageable:
        max-page-size: 100

server:
  shutdown: graceful
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # 32+ bytes. The default exists only so that local runs work; the postgres profile refuses to start with it.
    secret: ${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret}
    ttl: 8h
  cookie:
    secure: false          # set true behind HTTPS
