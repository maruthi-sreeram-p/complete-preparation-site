# docker compose up --build        -> http://localhost:8088
# The database is Postgres, and JWT_SECRET and DB_PASSWORD must come from the environment (see .env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - notes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/notes
      DB_USER: notes
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # true once the site is served over https
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\r\n\r\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      retries: 30
      start_period: 20s

  web:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  notes-data:
